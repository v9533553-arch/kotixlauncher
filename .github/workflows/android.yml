name: KotixLauncher Debug APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Get LTW
        run: |
          cd app_pojavlauncher/libs
          wget https://github.com/PojavLauncherTeam/LTW/releases/download/Rel/ltw-release.aar

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"

      - name: Build JRE JAR files
        run: |
          ./scripts/languagelist_updater.sh
          mkdir out
          gradle :jre_lwjgl3glfw:build --no-daemon

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Debug APK (without bundled Java runtime)
        run: |
          gradle :app_pojavlauncher:assembleDebug
          mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/kotix-debug-noruntime.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kotix-debug-noruntime
          path: out/kotix-debug-noruntime.apk
